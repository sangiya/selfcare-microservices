spring:
  application:
    name: reports-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/reports_service}
    username: ${DB_USERNAME:reports_service}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8083}

platform:
  tenant:
    default-tenant-id: ${TENANT_ID:default}
  security:
    jwk-set-uri: ${AUTH_SERVICE_JWK_URI:} # unset -> permit-all (dev only, logs a warning) -- see ResourceServerSecurityConfig
  feature-flags:
    api-url: ${UNLEASH_API_URL:}
    api-token: ${UNLEASH_API_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
