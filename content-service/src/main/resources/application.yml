spring:
  application:
    name: content-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/content_service}

server:
  port: ${SERVER_PORT:8085}

platform:
  tenant:
    default-tenant-id: ${TENANT_ID:default}
  security:
    jwk-set-uri: ${AUTH_SERVICE_JWK_URI:} # unset -> permit-all (dev only, logs a warning) -- see ResourceServerSecurityConfig
  feature-flags:
    api-url: ${UNLEASH_API_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
