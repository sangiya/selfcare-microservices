spring:
  application:
    name: config-tenant-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/selfcare_config}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 30s   # short TTL: config changes must propagate in seconds (see service javadoc)

server:
  port: ${SERVER_PORT:8081}

platform:
  tenant:
    default-tenant-id: ${TENANT_ID:default}
  security:
    jwk-set-uri: ${AUTH_SERVICE_JWK_URI:} # unset -> permit-all (dev only, logs a warning) -- see ResourceServerSecurityConfig
  feature-flags:
    api-url: ${UNLEASH_API_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
