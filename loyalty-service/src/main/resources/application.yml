spring:
  application:
    name: loyalty-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/loyalty_service}
    username: ${DB_USERNAME:loyalty_service}
    password: ${DB_PASSWORD:} # never set a real default -- inject via secrets manager / k8s Secret
  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, not Hibernate auto-DDL
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8082}

platform:
  tenant:
    default-tenant-id: ${TENANT_ID:default}
  security:
    jwk-set-uri: ${AUTH_SERVICE_JWK_URI:} # unset -> permit-all (dev only, logs a warning) -- see ResourceServerSecurityConfig
  feature-flags:
    api-url: ${UNLEASH_API_URL:}

auth:
  service:
    base-url: ${AUTH_SERVICE_BASE_URL:} # unset -> NoOpCustomerValidationClient (dev only, logs a warning)

loyalty:
  mife:
    base-url: ${MIFE_BASE_URL:https://mife.internal.example.com}
    connect-timeout-ms: 3000
    read-timeout-ms: 8000
    balance-counter:
      alias: ${MIFE_SP_COUNTER_DTL_ALIAS:}
      auth: ${MIFE_SP_COUNTER_DTL_PASS:}
    transfer-counter:
      alias: ${MIFE_SP_COUNTER_TRANSFER_ALIAS:}
      auth: ${MIFE_SP_COUNTER_TRANSFER_PASS:}
    donate-counter:
      alias: ${MIFE_SP_COUNTER_DONATE_ALIAS:}
      auth: ${MIFE_SP_COUNTER_DONATE_PASS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
