# Local Jenkins, kept in its own compose file so it's opt-in and doesn't interfere with
# docker-compose.yml (the app stack). Bring it up separately, once the app stack already
# works:
#
#   docker compose -f docker-compose.jenkins.yml up -d --build          # Jenkins only
#   docker compose -f docker-compose.jenkins.yml --profile sonar up -d --build   # + local SonarQube
#
# Jenkins UI: http://localhost:9090  (not 8080 -- that's already api-gateway in the app stack)
services:
  jenkins:
    container_name: microservices-jenkins
    build:
      context: ./ci/jenkins
    # Running the controller as root and giving it the host's docker.sock is a
    # local/throwaway-only shortcut so it can run `docker build`/`docker push` steps without
    # fighting docker.sock group-ownership differences across OSes. A real org Jenkins never
    # does this -- it uses proper Docker-capable build agents instead (Doc 2 sec 3.8).
    user: root
    ports:
      - "9090:8080"
      - "50000:50000" # only needed if you later attach remote agents
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true -Dorg.jenkinsci.plugins.durabletask.BourneShellScript.HEARTBEAT_CHECK_INTERVAL=86400"
      JENKINS_ADMIN_PASSWORD: "admin"
      CONTAINER_REGISTRY_URL: "local-registry.local"
      SONARQUBE_URL: "http://sonarqube:9000"
      SONARQUBE_TOKEN: "${SONARQUBE_TOKEN:-}"
      NVD_API_KEY: "${NVD_API_KEY:-}"
      SCM_REPO_URL: "file:///workspace/microservices"
      SCM_BRANCH: "*/main"
      DEV_GATEWAY_URL: "http://host.docker.internal:8080"
      DEV_CONFIG_TENANT_URL: "http://host.docker.internal:8081"
      DEV_LOYALTY_URL: "http://host.docker.internal:8082"
      DEV_REPORTS_URL: "http://host.docker.internal:8083"
      DEV_NOTIFICATION_URL: "http://host.docker.internal:8084"
      DEV_CONTENT_URL: "http://host.docker.internal:8085"
      DEV_DAST_BASE_URL: "http://host.docker.internal:8080"
      QA_BOOTSTRAP_LOCAL_STACK: "true"
      TESTCONTAINERS_HOST_OVERRIDE: "host.docker.internal"
      JENKINS_CONTAINER_NAME: "microservices-jenkins"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace/microservices:ro

  sonarqube:
    profiles: ["sonar"]
    image: sonarqube:community
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

volumes:
  jenkins-home:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
